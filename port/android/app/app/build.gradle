// TTT2 Android APK. Native libraries and SDL2's Java come from the build, passed as properties:
//   gradle assembleDebug -Pttt2.jniLibs=<dir with arm64-v8a/*.so> -Pttt2.sdlJava=<SDL2>/android-project/app/src/main/java
plugins { id 'com.android.application' }

def jniDir = project.findProperty('ttt2.jniLibs') ?: '/workspaces/out/jniLibs'
def sdlJava = project.findProperty('ttt2.sdlJava') ?: '/workspaces/deps/SDL2/android-project/app/src/main/java'
def buildNumber = (project.findProperty('ttt2.versionCode') ?: '1') as int

android {
    namespace 'com.saavan.ttt2'
    compileSdk 35
    defaultConfig {
        applicationId 'com.saavan.ttt2'
        minSdk 29
        targetSdk 34
        versionCode buildNumber
        // r28: the release version shown in the app and compared with volvisionmods.com's latest version.
        // Raise it for every release (1.0.1 -> 1.0.2 ...); versionCode keeps counting commits.
        versionName project.findProperty('ttt2.versionName') ?: '1.0.3'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = [jniDir]
            java.srcDirs += [sdlJava]
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true             // compressed in the APK (about a third of the size), unpacked at install
            keepDebugSymbols += ['**/*.so']       // already stripped by the build script
        }
    }
    // r31: release builds (GitHub Actions) are signed with the project's own key, passed as properties:
    //   -Pttt2.keystore=<file.jks> -Pttt2.storePassword=.. -Pttt2.keyAlias=.. -Pttt2.keyPassword=..
    // Without them a release build falls back to the debug key.
    def releaseKey = project.findProperty('ttt2.keystore')
    signingConfigs {
        release {
            if (releaseKey) {
                storeFile file(releaseKey)
                storePassword project.findProperty('ttt2.storePassword')
                keyAlias project.findProperty('ttt2.keyAlias')
                keyPassword project.findProperty('ttt2.keyPassword')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; signingConfig releaseKey ? signingConfigs.release : signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
